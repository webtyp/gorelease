# GENERATED FILE — do not edit manually.
# Produced by ghaction and kept in sync by a test.
# To change it, edit the workflow definition and run: gotest ./...

name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: 'true'
      -
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os=${target%/*}
            arch=${target##*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags="-s -w -X github.com/tinywasm/gorelease.Version=${GITHUB_REF_NAME} -X main.Version=${GITHUB_REF_NAME}" \
              -o "dist/gorelease-${os}-${arch}" ./cmd/gorelease
          done
          # windows needs .exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X github.com/tinywasm/gorelease.Version=${GITHUB_REF_NAME} -X main.Version=${GITHUB_REF_NAME}" \
            -o "dist/gorelease-windows-amd64.exe" ./cmd/gorelease
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --generate-notes
          fi

        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      - name: Move the v1 tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -f v1 "${GITHUB_SHA}"
          git push origin -f v1

