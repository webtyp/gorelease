name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # gorelease is a developer-machine tool that authenticates through
      # tinywasm/keyring. On a GitHub runner the credential store is unavailable,
      # so `gorelease` would fail even with GH_TOKEN. In CI we build and publish
      # the binaries directly with `gh` and GH_TOKEN. The composite action
      # `tinywasm/gorelease@v1` remains the single-line interface for *other*
      # repositories (and for developer machines), kept in sync via
      # tests/action_sync_test.go.
      - name: Build the release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X github.com/tinywasm/gorelease.Version=${GITHUB_REF_NAME} -X main.Version=${GITHUB_REF_NAME}" \
              -o "dist/gorelease-${os}-${arch}" ./cmd/gorelease
          done
          # windows needs .exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X github.com/tinywasm/gorelease.Version=${GITHUB_REF_NAME} -X main.Version=${GITHUB_REF_NAME}" \
            -o "dist/gorelease-windows-amd64.exe" ./cmd/gorelease
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --generate-notes
          fi

      - name: Move the v1 tag
        run: |
          set -euo pipefail
          git tag -f v1 "${GITHUB_SHA}"
          git push origin -f v1
